<form class="fieldset">
  <div class="control-group">
    <label class="control-label">Background</label>
    <div class="controls">
      <input type="text" class="input-medium"
             data-property="display.visualizations.custom.wifi_channel_spectrum.wifi_channel_spectrum.backgroundColor"
             placeholder="transparent" />
      <span class="help-inline">CSS colour or "transparent"</span>
    </div>
  </div>
  <div class="control-group">
    <label class="control-label">Mine colour</label>
    <div class="controls">
      <input type="text" class="input-medium"
             data-property="display.visualizations.custom.wifi_channel_spectrum.wifi_channel_spectrum.mineColor"
             placeholder="#4e9af1" />
      <span class="help-inline">Colour for your own APs</span>
    </div>
  </div>
  <div class="control-group">
    <label class="control-label">Neighbour colour</label>
    <div class="controls">
      <input type="text" class="input-medium"
             data-property="display.visualizations.custom.wifi_channel_spectrum.wifi_channel_spectrum.neighbourColor"
             placeholder="#c77dff" />
      <span class="help-inline">Colour for neighbour APs</span>
    </div>
  </div>
</form>
